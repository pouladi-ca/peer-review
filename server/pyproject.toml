[project]
name = "panelist"
version = "0.1.0"
description = "Panelist sync and reading server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "webauthn>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["panelist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
