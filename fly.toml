app = "panelist-review"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  STATIC_DIR = "/app/dist"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[mounts]]
  source = "panelist_data"
  destination = "/data"
  initial_size = "3gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
